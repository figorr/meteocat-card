name: Build & Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout completo
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2️⃣ Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build del bundle
      - name: Build meteocat-card.js
        run: npm run build

      # 5️⃣ Crear estructura del ZIP manual
      - name: Prepare manual ZIP structure
        run: |
          rm -rf tmp
          mkdir -p tmp/meteocat-card
          cp dist/meteocat-card.js tmp/meteocat-card/
          cp dist/meteocat-card-editor.js tmp/meteocat-card/
          cp -r icons tmp/meteocat-card/

      # 6️⃣ Crear ZIP final antes de semantic-release
      - name: Create ZIP
        run: |
          cd tmp
          zip -r ../meteocat-card.zip meteocat-card
          cd ..
          echo "ZIP created at $PWD/meteocat-card.zip"

      # 7️⃣ Verificar que existen todos los assets antes de publicar
      - name: Verify release assets
        run: |
          test -f dist/meteocat-card.js
          test -f dist/meteocat-card-editor.js
          test -f meteocat-card.zip
          test "$(find icons -maxdepth 1 -name '*.svg' | wc -l)" -gt 0
          echo "Release assets are ready"

      # 8️⃣ Configurar Git author para semantic-release
      - name: Configure Git author
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "jdcuartero@yahoo.es"

      # 9️⃣ Ejecutar semantic-release: crea el release y sube todos los assets
      - name: Run semantic-release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
